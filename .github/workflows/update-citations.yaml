name: update-citations
run-name: update citations

on:
  workflow_call:
    inputs:
      open-pr:
        type: boolean
      refresh-scholar:
        type: boolean
        default: true
    secrets:
      CREATE_PR_TOKEN:
        required: false
    outputs:
      changed:
        value: ${{ jobs.update-citations.outputs.changed }}
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_COLOR: true
  GOOGLE_SCHOLAR_API_KEY: ${{ secrets.GOOGLE_SCHOLAR_API_KEY }}
  GOOGLE_SCHOLAR_DETAILS: "true"

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: update-citations-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install cite deps
        run: |
          python -m pip install --upgrade --requirement ./_cite/requirements.txt
          python -m pip install --upgrade pyyaml

      - name: Test citation integration
        run: python -m unittest discover -s _cite/tests -v

      - name: Restore citation response cache
        uses: actions/cache@v4
        with:
          path: _cite/.cache
          key: citations-v1-${{ runner.os }}-${{ hashFiles('_cite/requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citations-v1-${{ runner.os }}-${{ hashFiles('_cite/requirements.txt') }}-

      - name: Build updated citations
        env:
          GOOGLE_SCHOLAR_API_KEY: ${{ secrets.GOOGLE_SCHOLAR_API_KEY }}
          GOOGLE_SCHOLAR_DETAILS: "true"
          # Direct manual runs refresh Scholar; push callers opt out explicitly.
          CITE_SKIP_GOOGLE_SCHOLAR: ${{ github.event_name != 'workflow_dispatch' && inputs.refresh-scholar == false }}
        run: python _cite/cite.py
        timeout-minutes: 30

      - name: Check if citations changed
        id: changed
        uses: tj-actions/verify-changed-files@v20
        with:
          files: |
            _data/citations.yaml

      - name: Commit updated citations to branch
        if: |
          steps.changed.outputs.files_changed == 'true' &&
          inputs.open-pr != true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update citations"
          file_pattern: |
            _data/citations.yaml

      - name: Open pull request with updated citations
        if: |
          steps.changed.outputs.files_changed == 'true' &&
          inputs.open-pr == true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CREATE_PR_TOKEN || github.token }}
          branch: citation-data-update
          commit-message: Update citations
          add-paths: |
            _data/citations.yaml
          title: Periodic citation update
          body: |
            Auto update citations.

    outputs:
      changed: ${{ steps.changed.outputs.files_changed || false }}
