name: on-push
run-name: on push to main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write            # Allow building and deploying GitHub Pages
  id-token: write         # Required for deployment to GitHub Pages

jobs:
  update-citations:
    # Reuse the workflow to update citations and commit directly to main.
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit                 # Pass repository secrets to the called workflow
    with:
      open-pr: false                 # Commit directly to main
      # Routine website edits reuse Scholar data; scheduled/manual runs refresh it.
      refresh-scholar: ${{ github.event_name != 'push' }}

  build-site:
    needs: update-citations          # Wait for citation updates before building
    uses: ./.github/workflows/build-site.yaml
    secrets: inherit                 # Pass secrets needed by the build workflow
