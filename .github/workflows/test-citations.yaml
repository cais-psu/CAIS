name: test-citations
on:
  push:
    paths: ["_cite/**", ".github/workflows/test-citations.yaml"]
  pull_request:
    paths: ["_cite/**", ".github/workflows/test-citations.yaml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _cite/requirements.txt
      - run: python -m pip install -r _cite/requirements.txt
      - run: python -m unittest discover -s _cite/tests -v
